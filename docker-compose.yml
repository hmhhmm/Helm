# One command: docker compose up   ->  web http://localhost:3000 , api http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: helm
      POSTGRES_DB: helm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm"]
      interval: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://helm:helm@db:5432/helm
      LLM_MODE: fixtures
      BANK_SIGNING_SECRET: ${BANK_SIGNING_SECRET:-change-me-in-env}
      DEMO_MODE: ${DEMO_MODE:-false}
      OWNER_PASSCODE: ${OWNER_PASSCODE:-helm-demo}
      OWNER_TOKEN_SECRET: ${OWNER_TOKEN_SECRET:-change-me-in-env}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
volumes:
  pgdata:
